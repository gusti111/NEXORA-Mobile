name: Flutter CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, 'fix/**']

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Android debug build attempt ${attempt}/5"
            if flutter build apk --debug 2>&1 | tee /tmp/nexora-apk-build.log; then
              exit 0
            fi

            if ! grep -Eq 'HTTP response code: 50[234]|HTTP response code: 429|Temporary failure in name resolution|Connection timed out' /tmp/nexora-apk-build.log; then
              echo "Build failed for a non-transient reason; stopping without retry."
              exit 1
            fi

            if [ "${attempt}" -lt 5 ]; then
              echo "Gradle distribution/network error detected; retrying in 20 seconds."
              sleep 20
            fi
          done

          echo "Android debug build failed after five transient-network attempts."
          exit 1
