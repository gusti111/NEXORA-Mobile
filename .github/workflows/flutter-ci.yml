name: Flutter CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Commit resolved dependency lockfile
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "build(deps): update Flutter dependency lockfile [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mobile-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded
